[package]
name = "calculador_albercas"
version = "0.1.0"
edition = "2021"
authors = ["Rodrigo <tu_email@ejemplo.com>"]
description = "Calculadora de química y volumen para albercas en Rust"

[lib]
name = "calculador_albercas"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "calculador_albercas_desktop"
path = "src/main.rs"

[dependencies]
eframe = "0.28"

# Dependencias exclusivas de Android
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.5", features = ["native-activity"] }
winit = "0.29"

# Dependencias exclusivas de WebAssembly
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

# Configuración para cargo-apk
[package.metadata.android]
package = "com.rodrigo.calculador_albercas"
label = "Calculadora Albercas"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 21
target_sdk_version = 33

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"